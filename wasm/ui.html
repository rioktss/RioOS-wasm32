<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090d16">
<title>RioOS WASM32</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:#090d16;color:#e9f0fb;font:14px system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}
main{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px}
header{width:min(100%,1024px);display:flex;align-items:center;justify-content:space-between;gap:12px;color:#c8d4e5;font-size:12px}
header strong{font-size:14px;color:#fff;letter-spacing:.08em}#state{color:#8bd5ad}
canvas{display:block;width:min(100%,calc((100dvh - 58px)*4/3));height:auto;max-height:calc(100dvh - 58px);aspect-ratio:4/3;background:#000;image-rendering:auto;object-fit:contain;outline:none;touch-action:none;box-shadow:0 14px 48px #0009}
footer{font-size:11px;color:#8190a5;text-align:center}
@media(max-width:700px){main{padding:6px;gap:6px}canvas{width:min(100%,calc((100dvh - 42px)*4/3));max-height:calc(100dvh - 42px)}header{font-size:10px}}
</style>
</head>
<body>
<main>
<header><strong>RIOOS · MYKERNEL · WASM32</strong><span id="state">Starting WebAssembly…</span></header>
<canvas id="screen" width="1024" height="768" tabindex="0" aria-label="RioOS screen. Tap to unlock, click apps, or use arrow keys and Enter."></canvas>
<footer>Tap / click to interact · Arrow keys + Enter · Escape to go back</footer>
</main>
<script>
(() => {
  'use strict';
  const SECTOR_SIZE = 512;
  const SECTOR_PREFIX = 'rioos-wasm32-myfs-v1:';
  const canvas = document.getElementById('screen');
  const context = canvas.getContext('2d', { alpha: false });
  const state = document.getElementById('state');
  let instance = null;
  let pixels = null;
  let imageData = null;
  let framePending = false;

  function setState(message, failed = false) {
    state.textContent = message;
    state.style.color = failed ? '#ff9494' : '#8bd5ad';
  }
  function imports() {
    return { env: {
      rio_host_console_putc: () => 0,
      rio_host_storage_read(sector, ptr) {
        try {
          const out = new Uint8Array(instance.exports.memory.buffer, ptr >>> 0, SECTOR_SIZE);
          const encoded = localStorage.getItem(SECTOR_PREFIX + (sector >>> 0));
          if (encoded === null) { out.fill(0); return 0; }
          const binary = atob(encoded);
          if (binary.length !== SECTOR_SIZE) { out.fill(0); return -1; }
          for (let i = 0; i < SECTOR_SIZE; ++i) out[i] = binary.charCodeAt(i);
          return 0;
        } catch (error) {
          console.warn('RioOS storage read:', error);
          try { new Uint8Array(instance.exports.memory.buffer, ptr >>> 0, SECTOR_SIZE).fill(0); } catch (_) {}
          return -1;
        }
      },
      rio_host_storage_write(sector, ptr) {
        try {
          const bytes = new Uint8Array(instance.exports.memory.buffer, ptr >>> 0, SECTOR_SIZE);
          let any = false;
          for (let i = 0; i < SECTOR_SIZE; ++i) if (bytes[i] !== 0) { any = true; break; }
          const key = SECTOR_PREFIX + (sector >>> 0);
          if (!any) localStorage.removeItem(key);
          else {
            let binary = '';
            for (let i = 0; i < SECTOR_SIZE; ++i) binary += String.fromCharCode(bytes[i]);
            localStorage.setItem(key, btoa(binary));
          }
          return 0;
        } catch (error) { console.warn('RioOS storage write:', error); return -1; }
      },
      rio_host_epoch_seconds: () => Math.floor(Date.now() / 1000) >>> 0,
      rio_host_monotonic_millis: () => Math.floor(performance.now()) >>> 0,
      rio_host_prompt_password: (ptr, capacity) => {
        try { new Uint8Array(instance.exports.memory.buffer, ptr >>> 0, capacity >>> 0).fill(0); } catch (_) {}
        return -1;
      }
    }};
  }
  function render() {
    if (!instance) return;
    const e = instance.exports;
    const width = e.rio_framebuffer_width();
    const height = e.rio_framebuffer_height();
    const ptr = e.rio_framebuffer_ptr() >>> 0;
    const source = new Uint32Array(e.memory.buffer, ptr, width * height);
    for (let i = 0, j = 0; i < source.length; ++i, j += 4) {
      const value = source[i] >>> 0;
      imageData.data[j] = (value >>> 16) & 255;
      imageData.data[j + 1] = (value >>> 8) & 255;
      imageData.data[j + 2] = value & 255;
      imageData.data[j + 3] = 255;
    }
    context.putImageData(imageData, 0, 0);
    const uiState = e.rio_get_ui_state();
    const active = e.rio_get_active_app();
    setState(uiState === 0 ? 'Lock screen' : uiState === 1 ? 'Home' : uiState === 3 ? 'Control Centre' : `App ${active + 1}`);
  }
  function scheduleRender() {
    if (framePending) return;
    framePending = true;
    requestAnimationFrame(() => {
      framePending = false;
      if (instance && instance.exports.rio_take_dirty()) render();
    });
  }
  function pointerPosition(event) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: Math.max(0, Math.min(1023, Math.round((event.clientX - rect.left) * 1024 / rect.width))),
      y: Math.max(0, Math.min(767, Math.round((event.clientY - rect.top) * 768 / rect.height)))
    };
  }
  canvas.addEventListener('pointerdown', event => {
    event.preventDefault();
    canvas.setPointerCapture(event.pointerId);
    const p = pointerPosition(event);
    instance?.exports.rio_pointer(p.x, p.y, 1);
  });
  canvas.addEventListener('pointerup', event => {
    event.preventDefault();
    const p = pointerPosition(event);
    instance?.exports.rio_pointer(p.x, p.y, 0);
    scheduleRender();
  });
  canvas.addEventListener('pointercancel', event => {
    const p = pointerPosition(event);
    instance?.exports.rio_pointer(p.x, p.y, 0);
    scheduleRender();
  });
  window.addEventListener('keydown', event => {
    if (!instance) return;
    let code = 0;
    if (event.key === 'Enter') code = 13;
    else if (event.key === 'Escape') code = 27;
    else if (event.key === 'Backspace') code = 8;
    else if (event.key === 'ArrowLeft') code = 0x82;
    else if (event.key === 'ArrowRight') code = 0x83;
    else if (event.key === 'ArrowUp') code = 0x80;
    else if (event.key === 'ArrowDown') code = 0x81;
    else if (event.key.length === 1) code = event.key.charCodeAt(0);
    if (code) { event.preventDefault(); instance.exports.rio_key(code); scheduleRender(); }
  });
  async function start() {
    try {
      const response = await fetch('rioos.wasm');
      if (!response.ok) throw new Error(`HTTP ${response.status} while loading rioos.wasm`);
      const bytes = await response.arrayBuffer();
      const result = await WebAssembly.instantiate(bytes, imports());
      instance = result.instance;
      imageData = context.createImageData(1024, 768);
      pixels = new Uint32Array(instance.exports.memory.buffer, instance.exports.rio_framebuffer_ptr() >>> 0, 1024 * 768);
      void pixels;
      const resultCode = instance.exports.rio_init();
      if (resultCode < 0) throw new Error(`rio_init failed (${resultCode})`);
      instance.exports.rio_finish_boot();
      render();
      canvas.focus();
      setState('Lock screen · Ready');
      const loop = () => {
        if (!instance) return;
        instance.exports.rio_tick();
        scheduleRender();
        requestAnimationFrame(loop);
      };
      requestAnimationFrame(loop);
    } catch (error) {
      console.error(error);
      setState(`WASM error: ${error.message || error}`, true);
    }
  }
  start();
})();
</script>
</body>
</html>
